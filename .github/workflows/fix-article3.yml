name: Fix article 3 contact links

on:
  push:
    branches:
      - fix/article-3-contact-links

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix contact links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('blog/how-to-write-promotional-sms/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a\n            href="../../index.html"\n            class="header-button"', '<a\n            href="#"\n            class="header-button"')
          s = s.replace('<a\n        href="../../index.html"\n        class="primary-button"', '<a\n        href="#"\n        class="primary-button"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- blog/how-to-write-promotional-sms/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make article 3 consultation buttons open modal'
          git push