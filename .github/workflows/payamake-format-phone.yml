name: PAYAMAKE format phone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-phone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format footer phone
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<a\b[^>]*class=["\'][^"\']*footer-contact-phone[^"\']*["\'][^>]*>)(.*?)(</a>)'
          s2, n = re.subn(pattern, lambda m: m.group(1) + '0912.9.85.83.84' + m.group(3), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('footer-contact-phone anchor not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit formatted phone and remove temporary workflow
        run: |
          rm -f .github/workflows/payamake-format-phone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/payamake-format-phone.yml
          git commit -m "Format footer phone for readability" || exit 0
          git push
