          style = root / 'css/style.css'
          css = style.read_text(encoding='utf-8')
          css += r'''

/* =========================================================
   PAYAMAKE SHARED FOOTER + LEGAL PAGE
========================================================= */
.payamake-footer { background:#0f1f35; color:#fff; padding:56px 0 22px; }
.payamake-footer-grid { display:grid; grid-template-columns:1.2fr 1fr 1fr 1.35fr; gap:34px; align-items:start; }
.payamake-footer h3,.payamake-footer h4 { margin:0 0 14px; color:#fff; font-weight:800; }
.payamake-footer h3 { font-size:22px; }
.payamake-footer h4 { font-size:15px; }
.payamake-footer-brand p,.payamake-footer-contact p { margin:0; color:rgba(255,255,255,.68); font-size:13px; line-height:2; }
.payamake-footer-column ul { list-style:none; margin:0; padding:0; }
.payamake-footer-column li { margin:0 0 9px; }
.payamake-footer a { text-decoration:none; }
.payamake-footer-column a,.payamake-footer-contact a { color:rgba(255,255,255,.72); font-size:13px; transition:color .2s ease; }
.payamake-footer-column a:hover,.payamake-footer-contact a:hover { color:#00e0e6; }
.payamake-footer-contact { border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:18px 20px; background:rgba(255,255,255,.035); }
.payamake-footer-contact .footer-phone { display:inline-block; margin:8px 0 9px; color:#fff; font-size:20px; font-weight:800; direction:ltr; }
.payamake-footer-contact .footer-contact-note { font-size:12px; line-height:1.9; }
.payamake-footer-contact .footer-contact-note a { color:#fff; text-decoration:underline; text-underline-offset:3px; }
.payamake-footer-legal { margin-top:34px; padding-top:18px; border-top:1px solid rgba(255,255,255,.09); text-align:center; }
.payamake-footer-legal a { color:rgba(255,255,255,.58); font-size:12px; }
.payamake-footer-bottom { margin-top:14px; padding-top:0; border-top:0; color:rgba(255,255,255,.48); text-align:center; font-size:12px; }
.legal-page { padding:80px 0 90px; background:#f8fafc; min-height:60vh; }
.legal-page-intro { max-width:760px; margin:0 auto 38px; text-align:center; }
.legal-page-intro > span { color:#1A2F50; font-size:13px; font-weight:800; }
.legal-page-intro h1 { margin:8px 0 12px; color:#1A2F50; font-size:34px; font-weight:900; line-height:1.6; }
.legal-page-intro p { margin:0; color:#64748b; font-size:14px; line-height:2; }
.legal-columns { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch; }
.legal-card { background:#fff; border:1px solid #e2e8f0; border-radius:22px; padding:32px; box-shadow:0 12px 35px rgba(15,23,42,.06); }
.legal-card h2 { margin:0 0 20px; color:#1A2F50; font-size:23px; font-weight:900; }
.legal-card h3 { margin:24px 0 8px; color:#1A2F50; font-size:16px; font-weight:800; }
.legal-card p { margin:0 0 14px; color:#475569; font-size:14px; line-height:2.15; }
.legal-card p:last-child { margin-bottom:0; }
@media (max-width:768px) {
  .payamake-footer { padding:42px 0 20px; }
  .payamake-footer-grid { grid-template-columns:1fr; gap:28px; }
  .payamake-footer-contact { padding:17px 18px; }
  .legal-page { padding:52px 0 65px; }
  .legal-page-intro { margin-bottom:28px; }
  .legal-page-intro h1 { font-size:27px; }
  .legal-columns { grid-template-columns:1fr; gap:18px; }
  .legal-card { padding:24px 20px; }
}
'''
          style.write_text(css, encoding='utf-8')

          workflow = Path('.github/workflows/apply-final-footer.yml')
          workflow.unlink()

      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/sms-marketing-guide/index.html blog/best-time-to-send-promotional-sms/index.html blog/how-to-write-promotional-sms/index.html legal.html css/style.css .github/workflows/apply-final-footer.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: unify footer and add legal page"
          git push
