                <p>برای پرسش، اصلاح یا حذف اطلاعاتی که از طریق سایت در اختیار PAYAMAKE قرار داده‌اید، می‌توانید از راه‌های ارتباطی سایت درخواست خود را مطرح کنید.</p>
            </section>
            <section class="legal-card" id="terms">
                <h2>قوانین و شرایط استفاده</h2>
                <p>استفاده از سایت PAYAMAKE به معنی پذیرش استفاده متعارف و قانونی از محتوا و خدمات سایت است. اطلاعاتی که در فرم تماس وارد می‌کنید باید صحیح و متعلق به خودتان یا کسب‌وکارتان باشد.</p>
                <p>تعرفه‌ها، شرایط همکاری، محدوده خدمات و جزئیات اجرای کمپین می‌تواند بر اساس نیاز کسب‌وکار و توافق طرفین تعیین شود. اطلاعات سایت به‌تنهایی قرارداد یا تعهد قطعی برای ارائه یک خدمت خاص محسوب نمی‌شود.</p>
                <h3>استفاده مسئولانه از خدمات</h3>
                <p>خدمات پیامکی باید مطابق قوانین و مقررات مربوط به ارتباطات و تبلیغات مورد استفاده قرار گیرند. مسئولیت صحت اطلاعات و محتوایی که برای اجرای کمپین در اختیار PAYAMAKE قرار می‌گیرد بر عهده ارائه‌دهنده آن اطلاعات است.</p>
                <h3>تغییر شرایط</h3>
                <p>ممکن است با توسعه خدمات یا تغییر الزامات قانونی، متن این صفحه به‌روزرسانی شود. نسخه منتشرشده در همین صفحه مبنای اطلاع‌رسانی فعلی سایت خواهد بود.</p>
            </section>
        </div>
    </div>
</main>
<footer class="footer payamake-footer" id="payamakeFooter">
    <div class="container">
        <div class="payamake-footer-grid">
            <div class="payamake-footer-brand"><h3>PAYAMAKE</h3><p>پیامک هدفمند برای کسب‌وکارها؛ از انتخاب مخاطب و بانک شماره تا اجرای کمپین.</p></div>
            <div class="payamake-footer-column"><h4>دسترسی سریع</h4><ul><li><a href="index.html">خانه</a></li><li><a href="index.html#pricing">تعرفه</a></li><li><a href="index.html#trust">درباره ما</a></li><li><a href="blog/index.html">مقالات</a></li><li><a href="#" class="footer-contact-link">تماس با ما</a></li></ul></div>
            <div class="payamake-footer-column"><h4>خدمات</h4><ul><li><a href="#" class="footer-contact-link">مشاوره پیامکی</a></li><li><a href="index.html#database">بانک شماره</a></li><li><a href="index.html#pricing">تعرفه و قیمت</a></li><li><a href="index.html#solutions">اجرای کمپین</a></li></ul></div>
            <div class="payamake-footer-contact"><h4>ارتباط با ما</h4><p>برای مشاوره یا پشتیبانی تلفنی، می‌توانید با ما در ارتباط باشید.</p><a class="footer-phone" href="tel:09129858384">09129858384</a><p class="footer-contact-note">اگر ترجیح می‌دهید درخواستتان را آنلاین ثبت کنید، <a href="#" class="footer-contact-link">فرم تماس با ما</a> را تکمیل کنید تا در اسرع وقت با شما در ارتباط باشیم.</p></div>
        </div>
        <div class="payamake-footer-legal"><a href="legal.html">حریم خصوصی و قوانین استفاده</a></div>
        <div class="footer-bottom payamake-footer-bottom"><span>© ۱۴۰۵ PAYAMAKE — تمامی حقوق متعلق به SGEX است.</span></div>
    </div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
