name: Apply final shared footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update footer and legal page
        shell: python
        run: |
          from pathlib import Path
          import re, os

          root = Path('.')
          pages = [
              Path('index.html'),
              Path('blog/index.html'),
              Path('blog/sms-marketing-guide/index.html'),
              Path('blog/best-time-to-send-promotional-sms/index.html'),
              Path('blog/how-to-write-promotional-sms/index.html'),
          ]

          def rel(page, target):
              return os.path.relpath(root / target, page.parent).replace(os.sep, '/')

          def footer(page):
              home = rel(page, 'index.html')
              blog = rel(page, 'blog/index.html')
              legal = rel(page, 'legal.html')
              return f'''<footer class="footer payamake-footer" id="payamakeFooter">
    <div class="container">
        <div class="payamake-footer-grid">
            <div class="payamake-footer-brand">
                <h3>PAYAMAKE</h3>
                <p>پیامک هدفمند برای کسب‌وکارها؛ از انتخاب مخاطب و بانک شماره تا اجرای کمپین.</p>
            </div>

            <div class="payamake-footer-column">
                <h4>دسترسی سریع</h4>
                <ul>
                    <li><a href="{home}">خانه</a></li>
                    <li><a href="{home}#pricing">تعرفه</a></li>
                    <li><a href="{home}#trust">درباره ما</a></li>
                    <li><a href="{blog}">مقالات</a></li>
                    <li><a href="#" class="footer-contact-link">تماس با ما</a></li>
                </ul>
            </div>

            <div class="payamake-footer-column">
                <h4>خدمات</h4>
                <ul>
                    <li><a href="#" class="footer-contact-link">مشاوره پیامکی</a></li>
                    <li><a href="{home}#database">بانک شماره</a></li>
                    <li><a href="{home}#pricing">تعرفه و قیمت</a></li>
                    <li><a href="{home}#solutions">اجرای کمپین</a></li>
                </ul>
            </div>

            <div class="payamake-footer-contact">
                <h4>ارتباط با ما</h4>
                <p>برای مشاوره یا پشتیبانی تلفنی، می‌توانید با ما در ارتباط باشید.</p>
                <a class="footer-phone" href="tel:09129858384">09129858384</a>
                <p class="footer-contact-note">اگر ترجیح می‌دهید درخواستتان را آنلاین ثبت کنید، <a href="#" class="footer-contact-link">فرم تماس با ما</a> را تکمیل کنید تا در اسرع وقت با شما در ارتباط باشیم.</p>
            </div>
        </div>

        <div class="payamake-footer-legal">
            <a href="{legal}">حریم خصوصی و قوانین استفاده</a>
        </div>

        <div class="footer-bottom payamake-footer-bottom">
            <span>© ۱۴۰۵ PAYAMAKE — تمامی حقوق متعلق به SGEX است.</span>
        </div>
    </div>
</footer>'''

          for page in pages:
              text = page.read_text(encoding='utf-8')
              new, count = re.subn(r'<footer\b[\s\S]*?</footer>', footer(page), text, count=1, flags=re.I)
              if count != 1:
                  raise SystemExit(f'Footer not found: {page}')
              page.write_text(new, encoding='utf-8')

          legal = root / 'legal.html'
          if not legal.exists():
              legal.write_text('''<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
