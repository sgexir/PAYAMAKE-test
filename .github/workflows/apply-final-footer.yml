            <span>PAYAMAKE</span>
            <h1>حریم خصوصی و قوانین استفاده</h1>
            <p>چارچوب کلی حریم خصوصی و استفاده از خدمات PAYAMAKE.</p>
        </div>
        <div class="legal-columns">
            <section class="legal-card" id="privacy">
                <h2>حریم خصوصی</h2>
                <p>PAYAMAKE اطلاعاتی مانند نام و نام خانوادگی، شماره موبایل، نام برند یا کسب‌وکار و موضوع درخواست را زمانی دریافت می‌کند که شما آن‌ها را از طریق فرم تماس در اختیار ما قرار می‌دهید.</p>
                <p>این اطلاعات برای بررسی درخواست، ارائه مشاوره، پشتیبانی و برقراری ارتباط مرتبط با درخواست شما استفاده می‌شود.</p>
                <h3>حفاظت از اطلاعات</h3>
                <p>ما تلاش می‌کنیم اطلاعات دریافت‌شده را با روش‌های فنی و اجرایی مناسب محافظت کنیم. با این حال، هیچ روش انتقال یا نگهداری اطلاعات در اینترنت کاملاً بدون ریسک نیست.</p>
