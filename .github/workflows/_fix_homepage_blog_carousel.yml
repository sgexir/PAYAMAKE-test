name: Temporary homepage blog carousel fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: homepage mobile blog carousel') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix homepage mobile blog carousel CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    .mobile-blog-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
    }'''

          new = '''    .mobile-blog-grid {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: stretch;
        justify-content: flex-start;
        gap: 18px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 0 4px 12px;
        box-sizing: border-box;
    }

    .mobile-blog-grid::-webkit-scrollbar { display: none; }'''

          if old not in s:
              raise SystemExit('Expected homepage mobile blog CSS block was not found')

          s = s.replace(old, new, 1)

          marker = '''    .mobile-blog-card {
        min-width: 0;'''
          replacement = '''    .mobile-blog-card {
        flex: 0 0 86%;
        width: 86%;
        min-width: 86%;
        max-width: 86%;
        scroll-snap-align: start;'''

          if marker not in s:
              raise SystemExit('Expected mobile blog card block was not found')

          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_fix_homepage_blog_carousel.yml
          git commit -m "fix: homepage mobile blog carousel"
          git rm .github/workflows/_fix_homepage_blog_carousel.yml
          git commit -m "chore: remove temporary carousel fixer"
          git push
