name: One-shot Footer Migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply shared footer and legal page
        shell: python
        run: |
          from pathlib import Path
          import re
          import os

          root = Path('.')

          pages = [
              Path('index.html'),
              Path('blog/index.html'),
              Path('blog/best-time-to-send-promotional-sms/index.html'),
              Path('blog/how-to-write-promotional-sms/index.html'),
              Path('blog/sms-marketing-guide/index.html'),
          ]

          def rel(page, target):
              return os.path.relpath(root / target, page.parent).replace(os.sep, '/')

          def footer_for(page):
              home = rel(page, 'index.html')
              blog = rel(page, 'blog/index.html')
              legal = rel(page, 'legal.html')
              return f'''<footer class="footer payamake-footer" id="payamakeFooter">
            <div class="container">
              <div class="footer-grid payamake-footer-grid">
                <div class="footer-brand payamake-footer-brand">
                  <h3>PAYAMAKE</h3>
                  <p>پیامک هدفمند برای کسب‌وکارها؛ از انتخاب مخاطب و بانک شماره تا اجرای کمپین.</p>
                </div>

                <div class="footer-links payamake-footer-column">
                  <h4>دسترسی سریع</h4>
                  <ul>
                    <li><a href="{home}">خانه</a></li>
                    <li><a href="{home}#pricing">تعرفه</a></li>
                    <li><a href="{home}#trust">درباره ما</a></li>
                    <li><a href="{blog}">مقالات</a></li>
                    <li><a href="#" class="footer-contact-link">تماس با ما</a></li>
                  </ul>
                </div>

                <div class="footer-links payamake-footer-column">
                  <h4>خدمات</h4>
                  <ul>
                    <li><a href="#" class="footer-contact-link">مشاوره پیامکی</a></li>
                    <li><a href="{home}#database">بانک شماره</a></li>
                    <li><a href="{home}#pricing">تعرفه و قیمت</a></li>
                    <li><a href="{home}#solutions">اجرای کمپین</a></li>
                  </ul>
                </div>

                <div class="payamake-footer-contact">
                  <h4>ارتباط با ما</h4>
                  <p>برای مشاوره یا پشتیبانی تلفنی، می‌توانید با ما در ارتباط باشید.</p>
                  <a class="footer-phone" href="tel:09129858384">09129858384</a>
                  <p class="footer-contact-note">اگر ترجیح می‌دهید درخواستتان را آنلاین ثبت کنید، <a href="#" class="footer-contact-link">فرم تماس با ما</a> را تکمیل کنید تا در اسرع وقت با شما تماس بگیریم.</p>
                </div>
              </div>

              <div class="payamake-footer-legal-links">
                <a href="{legal}">حریم خصوصی و قوانین استفاده</a>
              </div>

              <div class="footer-bottom payamake-footer-bottom">
                <span>© ۱۴۰۵ PAYAMAKE — تمامی حقوق متعلق به SGEX است.</span>
              </div>
            </div>
          </footer>'''

          for page in pages:
              text = page.read_text(encoding='utf-8')
              text, count = re.subn(r'<footer\b[\s\S]*?</footer>', footer_for(page), text, count=1)
              if count != 1:
                  raise SystemExit(f'Footer not found in {page}')
              page.write_text(text, encoding='utf-8')

          legal = root / 'legal.html'
          legal.write_text(f'''<!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="حریم خصوصی و قوانین استفاده از خدمات PAYAMAKE.">
            <link rel="icon" type="image/png" href="assets/favicon.png">
            <link rel="stylesheet" href="css/style.css">
            <title>حریم خصوصی و قوانین استفاده | PAYAMAKE</title>
          </head>
          <body class="legal-page-body">
            <header class="header">
              <div class="container">
                <a href="index.html" class="brand"><img src="assets/images/logo/payamake-header.png" alt="PAYAMAKE"><span class="brand-sub">پیامک هدفمند</span></a>
                <nav class="navigation">
                  <a href="index.html#solutions">راهکارها</a>
                  <a href="index.html#database">بانک شماره</a>
                  <a href="index.html#features">امکانات</a>
                  <a href="index.html#pricing">تعرفه</a>
                  <a href="blog/index.html">مقالات</a>
                  <a href="index.html#trust">درباره ما</a>
                </nav>
                <a href="index.html#" class="header-button">مشاوره رایگان</a>
              </div>
            </header>

            <main class="legal-page">
              <div class="container">
                <div class="legal-page-intro">
                  <span>PAYAMAKE</span>
                  <h1>حریم خصوصی و قوانین استفاده</h1>
                  <p>این صفحه چارچوب کلی استفاده از خدمات PAYAMAKE و نحوه برخورد ما با اطلاعاتی را که از طریق سایت در اختیارمان قرار می‌دهید توضیح می‌دهد.</p>
                </div>

                <div class="legal-columns">
                  <section class="legal-card" id="privacy">
                    <h2>حریم خصوصی</h2>
                    <p>PAYAMAKE اطلاعاتی مانند نام و نام خانوادگی، شماره موبایل، نام برند یا کسب‌وکار و موضوع درخواست را زمانی دریافت می‌کند که شما آن‌ها را از طریق فرم تماس در اختیار ما قرار می‌دهید.</p>
                    <p>این اطلاعات برای بررسی درخواست، ارائه مشاوره، پشتیبانی و برقراری ارتباط با شما استفاده می‌شود و هدف ما استفاده از اطلاعات در همان چارچوب ارتباطی مرتبط با درخواست شماست.</p>
                    <h3>حفاظت از اطلاعات</h3>
                    <p>ما تلاش می‌کنیم اطلاعات دریافت‌شده را با روش‌های فنی و اجرایی مناسب محافظت کنیم. با این حال، هیچ روش انتقال یا نگهداری اطلاعات در اینترنت را نمی‌توان کاملاً بدون ریسک دانست.</p>
                    <h3>درخواست اصلاح یا حذف</h3>
                    <p>اگر درباره اطلاعاتی که از طریق سایت در اختیار PAYAMAKE قرار داده‌اید پرسشی دارید یا می‌خواهید اطلاعاتتان اصلاح یا حذف شود، می‌توانید از طریق راه‌های ارتباطی سایت درخواست خود را مطرح کنید.</p>
                  </section>

                  <section class="legal-card" id="terms">
                    <h2>قوانین و شرایط استفاده</h2>
                    <p>استفاده از سایت PAYAMAKE به معنی پذیرش استفاده متعارف و قانونی از محتوا و خدمات سایت است. اطلاعاتی که در فرم تماس وارد می‌کنید باید صحیح و متعلق به خودتان یا کسب‌وکارتان باشد.</p>
                    <p>تعرفه‌ها، شرایط همکاری، محدوده خدمات و جزئیات اجرای کمپین می‌تواند بر اساس نیاز کسب‌وکار و توافق طرفین تعیین شود. اطلاعات درج‌شده در سایت به‌تنهایی قرارداد یا تعهد قطعی برای ارائه یک خدمت خاص محسوب نمی‌شود.</p>
                    <h3>استفاده مسئولانه از خدمات</h3>
                    <p>خدمات پیامکی باید مطابق قوانین و مقررات مربوط به ارتباطات و تبلیغات مورد استفاده قرار گیرند. مسئولیت صحت اطلاعات و محتوایی که برای اجرای کمپین در اختیار PAYAMAKE قرار می‌گیرد بر عهده ارائه‌دهنده آن اطلاعات است.</p>
                    <h3>تغییر شرایط</h3>
                    <p>ممکن است با توسعه خدمات یا تغییر الزامات قانونی، متن این صفحه به‌روزرسانی شود. نسخه منتشرشده در همین صفحه، مبنای اطلاع‌رسانی فعلی سایت خواهد بود.</p>
                  </section>
                </div>
              </div>
            </main>

            <div class="contact-modal" id="contactModal" aria-hidden="true">
              <div class="contact-modal-overlay"></div>
              <div class="contact-modal-box" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
                <button type="button" class="contact-modal-close" id="contactModalClose" aria-label="بستن">&times;</button>
                <div class="contact-modal-header">
                  <span class="contact-modal-badge">PAYAMAKE</span>
                  <h2 id="contactModalTitle">مشاوره رایگان</h2>
                  <p>اطلاعات خود را وارد کنید تا کارشناسان PAYAMAKE با شما تماس بگیرند.</p>
                </div>
                <form class="contact-form" id="contactForm">
                  <div class="contact-form-group"><label for="contactName">نام و نام خانوادگی</label><input type="text" id="contactName" name="name" placeholder="نام و نام خانوادگی" required></div>
                  <div class="contact-form-group"><label for="contactPhone">شماره موبایل</label><input type="tel" id="contactPhone" name="phone" placeholder="09xxxxxxxxx" required></div>
                  <div class="contact-form-group"><label for="contactMessage">توضیحات <span>(اختیاری)</span></label><textarea id="contactMessage" name="message" rows="4" placeholder="موضوع یا توضیحات خود را بنویسید..."></textarea></div>
                  <button type="submit" class="primary-button contact-submit">درخواست مشاوره</button>
                  <div class="contact-form-message" id="contactFormMessage" aria-live="polite"></div>
                </form>
              </div>
            </div>

            {footer_for(Path('legal.html'))}
            <script src="js/main.js"></script>
          </body>
          </html>\n''', encoding='utf-8')

          style = root / 'css/style.css'
          css = style.read_text(encoding='utf-8')
          css += r'''

/* =========================================================
   PAYAMAKE SHARED FOOTER — FINAL
========================================================= */

.payamake-footer {
    background: #0f1f35;
    color: #ffffff;
    padding: 56px 0 22px;
}

.payamake-footer-grid {
    display: grid;
    grid-template-columns: 1.25fr 1fr 1fr 1.35fr;
    gap: 34px;
    align-items: start;
}

.payamake-footer-brand h3,
.payamake-footer-column h4,
.payamake-footer-contact h4 {
    margin: 0 0 14px;
    color: #ffffff;
    font-weight: 800;
}

.payamake-footer-brand h3 {
    font-size: 22px;
    letter-spacing: .3px;
}

.payamake-footer-brand p,
.payamake-footer-contact p {
    margin: 0;
    color: rgba(255,255,255,.68);
    font-size: 13px;
    line-height: 2;
}

.payamake-footer-column ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

.payamake-footer-column li {
    margin: 0 0 9px;
}

.payamake-footer-column a,
.payamake-footer-contact a {
    color: rgba(255,255,255,.72);
    text-decoration: none;
    font-size: 13px;
    transition: color .2s ease;
}

.payamake-footer-column a:hover,
.payamake-footer-contact a:hover {
    color: #00e0e6;
}

.payamake-footer-contact {
    padding: 18px 20px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 16px;
    background: rgba(255,255,255,.035);
}

.payamake-footer-contact .footer-phone {
    display: inline-block;
    direction: ltr;
    margin: 10px 0 7px;
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .2px;
}

.payamake-footer-contact .footer-contact-note {
    font-size: 12px;
    line-height: 1.9;
}

.payamake-footer-contact .footer-contact-note a {
    color: #00e0e6;
}

.payamake-footer-legal-links {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.08);
    text-align: center;
}

.payamake-footer-legal-links a {
    color: rgba(255,255,255,.62);
    text-decoration: none;
    font-size: 12px;
}

.payamake-footer-legal-links a:hover {
    color: #00e0e6;
}

.payamake-footer-bottom {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0;
    color: rgba(255,255,255,.48);
    font-size: 11px;
    text-align: center;
}

/* Legal page */
.legal-page-body {
    background: #f8fafc;
}

.legal-page {
    padding: 90px 0 80px;
}

.legal-page-intro {
    max-width: 760px;
    margin: 0 auto 42px;
    text-align: center;
}

.legal-page-intro > span {
    display: block;
    margin-bottom: 8px;
    color: #1A2F50;
    font-size: 13px;
    font-weight: 800;
}

.legal-page-intro h1 {
    margin: 0 0 12px;
    color: #1A2F50;
    font-size: 34px;
    font-weight: 900;
}

.legal-page-intro p {
    margin: 0;
    color: #64748b;
    font-size: 14px;
    line-height: 2;
}

.legal-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
}

.legal-card {
    padding: 34px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    box-shadow: 0 12px 35px rgba(15,23,42,.05);
}

.legal-card h2 {
    margin: 0 0 22px;
    color: #1A2F50;
    font-size: 24px;
    font-weight: 900;
}

.legal-card h3 {
    margin: 24px 0 8px;
    color: #334155;
    font-size: 16px;
    font-weight: 800;
}

.legal-card p {
    margin: 0 0 14px;
    color: #64748b;
    font-size: 14px;
    line-height: 2.05;
}

@media (max-width: 900px) {
    .payamake-footer-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .payamake-footer {
        padding: 42px 0 18px;
    }

    .payamake-footer-grid {
        grid-template-columns: 1fr;
        gap: 28px;
    }

    .payamake-footer-contact {
        padding: 18px;
    }

    .payamake-footer-contact .footer-phone {
        font-size: 19px;
    }

    .legal-page {
        padding: 58px 0 50px;
    }

    .legal-page-intro {
        margin-bottom: 28px;
    }

    .legal-page-intro h1 {
        font-size: 27px;
    }

    .legal-columns {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .legal-card {
        padding: 24px 20px;
        border-radius: 16px;
    }

    .legal-card h2 {
        font-size: 21px;
    }
}
'''
          style.write_text(css, encoding='utf-8')

      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [Path('index.html'), Path('blog/index.html'), Path('blog/best-time-to-send-promotional-sms/index.html'), Path('blog/how-to-write-promotional-sms/index.html'), Path('blog/sms-marketing-guide/index.html'), Path('legal.html')]
          for page in pages:
              s = page.read_text(encoding='utf-8')
              assert s.count('class="payamake-footer"') == 1, page
              assert '© ۱۴۰۵ PAYAMAKE — تمامی حقوق متعلق به SGEX است.' in s, page
          assert Path('legal.html').exists()
          print('Footer/legal validation passed for', len(pages), 'pages')
          PY

      - name: Commit final migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/best-time-to-send-promotional-sms/index.html blog/how-to-write-promotional-sms/index.html blog/sms-marketing-guide/index.html legal.html css/style.css .github/workflows/one-shot-footer-migration.yml
          git commit -m "feat: unify footer and add legal page"
          git rm .github/workflows/one-shot-footer-migration.yml
          git commit -m "chore: remove one-shot footer migration"
          git push
