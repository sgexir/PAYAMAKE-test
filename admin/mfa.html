<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تأیید ورود | PAYAMAKE</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <span class="auth-brand-main">PAYAMAKE</span>
            <span>پنل مدیریت</span>
        </div>

        <div class="auth-heading">
            <h1>تأیید ورود</h1>

            <p>
                برای تکمیل ورود، کد احراز هویت خود را وارد کنید.
            </p>
        </div>

        <form
            id="mfaForm"
            class="admin-form"
            novalidate
        >

            <input
                id="mfaMethodId"
                type="hidden"
                name="methodId"
            >

            <input
                id="mfaChallengeId"
                type="hidden"
                name="challengeId"
            >

            <div
                id="mfaMethods"
                class="mfa-methods"
            ></div>

            <div class="form-group">
                <label for="mfaCode">
                    کد احراز هویت
                </label>

                <input
                    id="mfaCode"
                    name="code"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="000000"
                    dir="ltr"
                    required
                >
            </div>

            <button
                class="admin-button primary"
                type="submit"
            >
                تأیید و ورود
            </button>

            <div
                id="mfaMessage"
                class="form-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>

        <a
            class="back-link"
            href="/admin/login.html"
        >
            بازگشت به ورود
        </a>

    </div>

</main>

<script src="../js/admin.js"></script>

</body>
</html>
